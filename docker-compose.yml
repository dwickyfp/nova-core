services:
  # ─── FoundationDB coordinator + server ───
  fdb:
    image: foundationdb/foundationdb:7.4.0
    container_name: nova-fdb
    ports:
      - "4500:4500"
    environment:
      FDB_CLUSTER_FILE_CONTENTS: "docker:docker@nova-fdb:4500"
      FDB_NETWORKING_MODE: container
    volumes:
      - nova-fdb-data:/var/lib/foundationdb
      - nova-fdb-logs:/var/log/foundationdb
    healthcheck:
      test: ["CMD", "fdbcli", "-C", "/var/fdb/fdb.cluster", "--exec", "status", "--timeout", "5"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - nova-net

  # ─── Initialize FDB database (run once) ───
  fdb-init:
    image: foundationdb/foundationdb:7.4.0
    container_name: nova-fdb-init
    depends_on:
      fdb:
        condition: service_healthy
    environment:
      FDB_CLUSTER_FILE_CONTENTS: "docker:docker@nova-fdb:4500"
    entrypoint: ["/usr/bin/fdbcli", "-C", "/var/fdb/fdb.cluster", "--exec", "configure new single memory", "--timeout", "30"]
    restart: "no"
    networks:
      - nova-net

  # ─── MinIO (S3-compatible object storage) ───
  minio:
    image: minio/minio:latest
    container_name: nova-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: nova
      MINIO_ROOT_PASSWORD: nova12345
    command: server /data --console-address ":9001"
    volumes:
      - nova-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nova-net

  # ─── Create MinIO bucket ───
  createbucket:
    image: minio/mc:latest
    container_name: nova-createbucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set nova http://minio:9000 nova nova12345;
      mc mb nova/nova --ignore-existing;
      echo 'Bucket nova created';
      "
    restart: "no"
    networks:
      - nova-net

volumes:
  nova-fdb-data:
  nova-fdb-logs:
  nova-minio-data:

networks:
  nova-net:
    driver: bridge
