# Nova Engine — Docker / FDB Production Config
# Used inside Docker Compose (service names as hostnames)

[server]
host = "0.0.0.0"
port = 3306

[storage]
s3_endpoint  = "http://minio:9000"
s3_bucket    = "nova"
s3_access_key = "nova"
s3_secret_key = "nova12345"
s3_region    = "us-east-1"

[metadata]
backend          = "fdb"
fdb_cluster_file = "docker:docker@nova-fdb:4500"

[auth]
enabled          = false
default_username = "root"
