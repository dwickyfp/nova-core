# Nova Engine — Docker / FDB development config.
# Storage credentials are supplied by NOVA_STORAGE_S3_ACCESS_KEY and
# NOVA_STORAGE_S3_SECRET_KEY in docker-compose.yml; placeholders are not secrets.

[server]
host = "0.0.0.0"
port = 3306

[storage]
s3_endpoint = "http://minio:9000"
s3_bucket = "nova"
s3_access_key = "<set NOVA_STORAGE_S3_ACCESS_KEY>"
s3_secret_key = "<set NOVA_STORAGE_S3_SECRET_KEY>"
s3_region = "us-east-1"

[metadata]
fdb_cluster_file = "docker:docker@nova-fdb:4500"

[auth]
enabled = false
allow_insecure = true
default_username = "root"
