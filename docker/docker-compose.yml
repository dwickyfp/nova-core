# nova-core local development cluster
# Services: FoundationDB + MinIO + 1 Coordinator + 2 Workers
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml down
#   docker compose -f docker/docker-compose.yml logs -f

name: nova-core

services:

  # ── FoundationDB (metadata store) ──────────────────────────
  fdb:
    image: foundationdb/foundationdb:7.3.43
    container_name: nova-fdb
    ports:
      - "4500:4500"
      - "4501:4501"
    environment:
      FDB_NETWORKING_MODE: host
      FDB_COORDINATOR: fdb:4500
    volumes:
      - fdb_data:/var/fdb
    healthcheck:
      test: ["CMD", "fdbcli", "--exec", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nova

  # ── MinIO (S3-compatible object storage) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: nova-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nova

  # ── MinIO Init (auto-create buckets) ──────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: nova-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set nova http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing nova/nova;
      echo 'MinIO init complete!';
      "
    networks:
      - nova

  # ── Nova Coordinator ──────────────────────────────────────
  coordinator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nova-coordinator
    command: ["nova", "server", "--config", "/etc/nova/config.toml"]
    depends_on:
      fdb:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "4406:4406"   # MySQL protocol
      - "8080:8080"   # REST API
    volumes:
      - ./config.toml:/etc/nova/config.toml:ro
    environment:
      NOVA_LOG_LEVEL: info
    networks:
      - nova

  # ── Nova Worker 1 ─────────────────────────────────────────
  worker-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nova-worker-1
    command: ["nova", "worker", "--config", "/etc/nova/config.toml"]
    depends_on:
      coordinator:
        condition: service_started
    volumes:
      - ./config.toml:/etc/nova/config.toml:ro
      - worker1_cache:/data/cache
    environment:
      NOVA_LOG_LEVEL: info
      NOVA_WORKER_GRPC_PORT: "50051"
    networks:
      - nova

  # ── Nova Worker 2 ─────────────────────────────────────────
  worker-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nova-worker-2
    command: ["nova", "worker", "--config", "/etc/nova/config.toml"]
    depends_on:
      coordinator:
        condition: service_started
    volumes:
      - ./config.toml:/etc/nova/config.toml:ro
      - worker2_cache:/data/cache
    environment:
      NOVA_LOG_LEVEL: info
      NOVA_WORKER_GRPC_PORT: "50052"
    networks:
      - nova

networks:
  nova:

volumes:
  fdb_data:
  minio_data:
  worker1_cache:
  worker2_cache:
