# nova-core local development cluster
# Services: FoundationDB + MinIO + 1 Coordinator + 2 Workers
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs -f nova-coordinator
#   docker compose -f docker/docker-compose.yml down -v

name: nova-core

services:

  # ── FoundationDB (metadata store) ──────────────────────────
  fdb:
    image: foundationdb/foundationdb:7.4.0
    container_name: nova-fdb
    ports:
      - "4500:4500"
    environment:
      FDB_CLUSTER_FILE_CONTENTS: "docker:docker@nova-fdb:4500"
      FDB_NETWORKING_MODE: container
    volumes:
      - fdb_data:/var/lib/foundationdb
      - fdb_logs:/var/log/foundationdb
    healthcheck:
      test: ["CMD", "fdbcli", "-C", "/var/fdb/fdb.cluster", "--exec", "status", "--timeout", "5"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - nova

  # ── FDB Init (run once — configure new single memory) ──────
  fdb-init:
    image: foundationdb/foundationdb:7.4.0
    container_name: nova-fdb-init
    depends_on:
      fdb:
        condition: service_healthy
    environment:
      FDB_CLUSTER_FILE_CONTENTS: "docker:docker@nova-fdb:4500"
    entrypoint:
      - /usr/bin/fdbcli
      - -C
      - /var/fdb/fdb.cluster
      - --exec
      - "configure new single memory"
      - --timeout
      - "30"
    restart: "no"
    networks:
      - nova

  # ── MinIO (S3-compatible object storage) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: nova-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"    # MinIO Console UI
    environment:
      MINIO_ROOT_USER: nova
      MINIO_ROOT_PASSWORD: nova12345
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nova

  # ── MinIO Init (auto-create nova bucket) ──────────────────
  minio-init:
    image: minio/mc:latest
    container_name: nova-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set nova http://minio:9000 nova nova12345;
      mc mb --ignore-existing nova/nova;
      echo 'MinIO init complete — bucket nova ready';
      "
    restart: "no"
    networks:
      - nova

  # ── Nova Coordinator ──────────────────────────────────────
  coordinator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nova-core:latest
    container_name: nova-coordinator
    command: ["nova", "server", "--config", "/etc/nova/config.toml"]
    depends_on:
      fdb:
        condition: service_healthy
      minio:
        condition: service_healthy
      fdb-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3306:3306"    # MySQL protocol
      - "9090:9090"    # Monitoring / metrics
    volumes:
      - ./config-fdb.toml:/etc/nova/config.toml:ro
    environment:
      NOVA_LOG_LEVEL: info
      RUST_LOG: info
    restart: unless-stopped
    networks:
      - nova

  # ── Nova Worker 1 ─────────────────────────────────────────
  worker-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nova-core:latest
    container_name: nova-worker-1
    command: ["nova", "worker", "--config", "/etc/nova/config.toml", "--grpc-addr", "0.0.0.0:50051", "--coordinator-addr", "nova-coordinator:50060"]
    depends_on:
      coordinator:
        condition: service_started
    volumes:
      - ./config-fdb.toml:/etc/nova/config.toml:ro
      - worker1_cache:/data/cache
    environment:
      NOVA_LOG_LEVEL: info
      NOVA_WORKER_ADDRESS: nova-worker-1
    restart: unless-stopped
    networks:
      - nova

  # ── Nova Worker 2 ─────────────────────────────────────────
  worker-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nova-core:latest
    container_name: nova-worker-2
    command: ["nova", "worker", "--config", "/etc/nova/config.toml", "--grpc-addr", "0.0.0.0:50052", "--coordinator-addr", "nova-coordinator:50060"]
    depends_on:
      coordinator:
        condition: service_started
    volumes:
      - ./config-fdb.toml:/etc/nova/config.toml:ro
      - worker2_cache:/data/cache
    environment:
      NOVA_LOG_LEVEL: info
      NOVA_WORKER_ADDRESS: nova-worker-2
    restart: unless-stopped
    networks:
      - nova

networks:
  nova:
    driver: bridge

volumes:
  fdb_data:
  fdb_logs:
  minio_data:
  worker1_cache:
  worker2_cache:
