[package]
name = "nova-coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nova-common = { path = "../nova-common" }
nova-storage = { path = "../nova-storage" }
arrow = { workspace = true }
datafusion = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
bytes = "1.5"
sled = "0.34"
thiserror = "1.0"
tracing = "0.1"
serde = { workspace = true }
bincode = { workspace = true }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
futures = "0.3"
nova-worker = { path = "../nova-worker" }
figment = { workspace = true }
axum = "0.8"
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
sqlparser = "0.52"
argon2 = "0.5"
foyer = { workspace = true }
object_store.workspace = true
openraft = { version = "0.9.24", features = ["storage-v2", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
criterion = { version = "0.5", features = ["async_tokio"] }

[build-dependencies]
tonic-prost-build = "0.14"

[[bench]]
name = "query_benchmarks"
harness = false

[[bench]]
name = "cache_benchmarks"
harness = false

[[bench]]
name = "rbac_benchmarks"
harness = false
