syntax = "proto3";

package nova.rpc;

// Worker → Coordinator registry RPC service
service CoordinatorService {
  rpc RegisterWorker(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc DeregisterWorker(DeregisterRequest) returns (DeregisterResponse);
}

// Coordinator → Worker execution RPC service
service WorkerService {
  rpc RegisterWorker(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ExecuteFragment(FragmentRequest) returns (stream FragmentResult);
  rpc DeregisterWorker(DeregisterRequest) returns (DeregisterResponse);
}

// Coordinator ↔ Coordinator Raft consensus RPC service
service RaftService {
  rpc AppendEntries(RaftAppendEntriesRequest) returns (RaftAppendEntriesResponse);
  rpc Vote(RaftVoteRequest) returns (RaftVoteResponse);
  rpc InstallSnapshot(RaftSnapshotRequest) returns (RaftSnapshotResponse);
}

// --- Worker messages ---

message RegisterRequest {
  string address = 1;
  uint32 grpc_port = 2;
  uint64 memory_limit_bytes = 3;
  uint32 cpu_count = 4;
}

message RegisterResponse {
  uint64 worker_id = 1;
  string session_token = 2;
}

message HeartbeatRequest {
  uint64 worker_id = 1;
  double cpu_usage = 2;
  double memory_usage = 3;
  uint32 active_queries = 4;
  uint64 cache_hit_count = 5;
  uint64 cache_miss_count = 6;
}

message HeartbeatResponse {
  bool healthy = 1;
  string message = 2;
}

message FragmentRequest {
  uint64 fragment_id = 1;
  string sql = 2;
  repeated TableSnapshot tables = 3;
  uint32 batch_size = 4;
}

message TableSnapshot {
  string table_name = 1;
  bytes schema = 2;
  repeated MicroPartitionInfo mps = 3;
}

message MicroPartitionInfo {
  uint64 mp_id = 1;
  string s3_path = 2;
  uint64 row_count = 3;
  uint64 byte_size = 4;
}

message FragmentResult {
  bytes batch = 1;
  bool done = 2;
  string error = 3;
}

message DeregisterRequest {
  uint64 worker_id = 1;
}

message DeregisterResponse {
  bool success = 1;
}

// --- Raft messages (opaque JSON payloads — avoids versioning openraft internals) ---

message RaftAppendEntriesRequest {
  uint64 target_node_id = 1;
  bytes payload = 2;
}

message RaftAppendEntriesResponse {
  bytes payload = 1;
  string error = 2;
}

message RaftVoteRequest {
  uint64 target_node_id = 1;
  bytes payload = 2;
}

message RaftVoteResponse {
  bytes payload = 1;
  string error = 2;
}

message RaftSnapshotRequest {
  uint64 target_node_id = 1;
  bytes payload = 2;
}

message RaftSnapshotResponse {
  bytes payload = 1;
  string error = 2;
}
