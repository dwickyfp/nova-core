syntax = "proto3";

package nova.rpc;

// Coordinator ↔ Worker RPC service
service WorkerService {
  // Worker registers with coordinator on startup
  rpc RegisterWorker(RegisterRequest) returns (RegisterResponse);
  
  // Worker sends heartbeat every 5 seconds
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  
  // Coordinator dispatches a query fragment to worker
  rpc ExecuteFragment(FragmentRequest) returns (stream FragmentResult);
  
  // Worker deregisters on shutdown
  rpc DeregisterWorker(DeregisterRequest) returns (DeregisterResponse);
}

message RegisterRequest {
  string address = 1;
  uint32 grpc_port = 2;
  uint64 memory_limit_bytes = 3;
  uint32 cpu_count = 4;
}

message RegisterResponse {
  uint64 worker_id = 1;
  string session_token = 2;
}

message HeartbeatRequest {
  uint64 worker_id = 1;
  double cpu_usage = 2;
  double memory_usage = 3;
  uint32 active_queries = 4;
  uint64 cache_hit_count = 5;
  uint64 cache_miss_count = 6;
}

message HeartbeatResponse {
  bool healthy = 1;
  string message = 2;
}

message FragmentRequest {
  uint64 fragment_id = 1;
  string sql = 2;
  repeated TableSnapshot tables = 3;
  uint32 batch_size = 4;
}

message TableSnapshot {
  string table_name = 1;
  bytes schema = 2;  // Arrow IPC schema
  repeated MicroPartitionInfo mps = 3;
}

message MicroPartitionInfo {
  uint64 mp_id = 1;
  string s3_path = 2;
  uint64 row_count = 3;
  uint64 byte_size = 4;
}

message FragmentResult {
  bytes batch = 1;  // Arrow IPC RecordBatch
  bool done = 2;
  string error = 3;
}

message DeregisterRequest {
  uint64 worker_id = 1;
}

message DeregisterResponse {
  bool success = 1;
}
